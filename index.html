<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Removed user-scalable=no to allow pinch-to-zoom on iPad -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marching Band App - Rehearsal Mode</title>
  <style>
    /* --- STAGE 1 & 2: LAYOUT --- */
    body, html { 
      margin: 0; padding: 0; height: 100dvh; width: 100vw; 
      overflow: hidden; 
      background-color: #121212; color: white; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }

    .app-container { display: flex; flex-direction: column; height: 100%; }

    /* Viewer Section */
    .viewer-section {
      flex-grow: 1; position: relative; background-color: #000;
      display: flex; justify-content: center; align-items: center; overflow: auto;
      /* Allows native touch interactions on the image */
      touch-action: pan-x pan-y pinch-zoom; 
    }
    #display-image { max-width: 100%; max-height: 100%; object-fit: contain; }
    
   .view-toggle {
      position: absolute; bottom: 20px; 
      background: rgba(0, 0, 0, 0.6); 
      backdrop-filter: blur(10px); border-radius: 30px; padding: 5px; display: flex; gap: 5px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5); 
    }
    .view-toggle button {
      background: transparent; border: none; color: #ffffff; padding: 10px 20px;
      border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .view-toggle button.active { background: #007aff; }

    /* Dashboard Section */
    .dashboard-section {
      background-color: #1e1e1e; padding: 15px; display: flex; flex-direction: column; gap: 10px;
      border-top: 1px solid #333; 
      padding-bottom: calc(env(safe-area-inset-bottom, 15px) + 15px); 
      max-height: 40vh; overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
    }

    .dashboard-row { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
    
    select, button, input[type="file"], input[type="number"] { 
      font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid #555; background: #333; color: white; 
    }
    
    /* Buttons */
    #playChunkBtn { background-color: #4CAF50; color: white; font-weight: bold; padding: 12px 24px; flex-grow: 1; }
    #pauseBtn { background-color: #f44336; color: white; padding: 12px 24px; }
    #stopBtn { background-color: #9e9e9e; color: black; padding: 12px 24px; }
    
    /* Utilities */
    .status-text { font-size: 14px; color: #aaa; }
    /* Updated Player Output for Live Tracking */
    #playerOutput { 
      font-family: monospace; color: #4CAF50; font-size: 18px; font-weight: bold; 
      text-align: center; width: 100%; margin-top: 5px; padding: 5px;
      background: #111; border-radius: 8px;
    }
    
    /* Mapper Styles */
    details { background: #111; padding: 15px; border-radius: 8px; margin-top: 10px; text-align: left; }
    summary { font-weight: bold; cursor: pointer; color: #888; }
    #tapBtn { background-color: #4CAF50; color: white; font-weight: bold; width: 100%; height: 60px; margin-top: 10px; }
    #startBtn { background-color: #008CBA; color: white; }
    #saveBtn { background-color: #ff9800; color: white; }
    #output { margin-top: 10px; font-family: monospace; background: #000; padding: 10px; border-radius: 5px; max-height: 100px; overflow-y: auto; color: #ccc; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ==================== VIEWER SECTION ==================== -->
    <div class="viewer-section" id="viewer-container">
      <img id="display-image" src="" alt="Load a tune to view pages" style="display: none;">
      
      <div class="view-toggle">
        <button id="btn-music-view" class="active">Music</button>
        <button id="btn-drill-view">Drill</button>
      </div>
    </div>

    <!-- ==================== DASHBOARD SECTION ==================== -->
    <div class="dashboard-section">
      
      <div class="dashboard-row">
        <button id="loadMasterDataBtn">1. Load Master Data</button>
        <select id="tuneSelect"><option value="">-- Load CSV First --</option></select>
        <select id="rehearsalMode">
          <option value="measures">Measures Mode</option>
          <option value="drill">Drill Mode</option>
        </select>
        <span id="dataStatus" class="status-text">Waiting for CSV...</span>
      </div>
      
      <div class="dashboard-row">
        <label>Start: <select id="startChunk"><option value="">-- Select Tune First --</option></select></label>
        <label>End: <select id="endChunk"><option value="">-- Select Tune First --</option></select></label>
      </div>

      <div class="dashboard-row">
        <button id="playChunkBtn">▶ Play Selection</button>
        <button id="pauseBtn">Pause</button>
        <button id="stopBtn">■ Stop</button>
      </div>
      
      <!-- Live Tracker Display -->
      <div id="playerOutput">Ready to rehearse.</div>

      <div class="dashboard-row" style="font-size: 14px;">
        <label>Music Vol: <input type="range" id="musicVolume" min="0" max="1" step="0.1" value="0.8" style="width: 80px;"></label>
        <label>Met Vol: <input type="range" id="metVolume" min="0" max="1" step="0.1" value="1.0" style="width: 80px;"></label>
        <label><input type="checkbox" id="playMetToggle" checked> Met</label>
        <label>Count-In: 
          <select id="countInSelect">
            <option value="8">8 Beats</option>
            <option value="4">4 Beats</option>
          </select>
        </label>
      </div>

      <!-- ==================== TRAINING MODE ==================== -->
      <details>
        <summary>Instructor Tools (Beat Mapper)</summary>
        <div class="control-group">
          <label>Audio File: <input type="file" id="audioUpload" accept="audio/*"></label><br><br>
          <audio id="audioPlayer"></audio>
          <div>
            <button id="startBtn">1. Play Audio</button>
            <button id="tapBtn">2. TAP (Spacebar)</button>
          </div>
          <div><button id="saveBtn">3. Save Taps Data</button></div>
          <div id="output">Timestamps will appear here...</div>
        </div>
      </details>
    </div>
  </div>

  <script>
    // --- STAGE 2: WAKE LOCK LOGIC ---
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) { console.error(`Wake Lock error: ${err.message}`); }
    }
    
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // --- VARIABLES ---
    const displayImage = document.getElementById("display-image");
    const btnMusicView = document.getElementById("btn-music-view");
    const btnDrillView = document.getElementById("btn-drill-view");
    const rehearsalMode = document.getElementById("rehearsalMode");
    
    let currentMusicPage = "1";
    let currentDrillPage = "1";
    let activeVisualView = "music"; 
    let currentTuneId = "";

    // Mapper UI
    const audioUpload = document.getElementById('audioUpload');
    const audioPlayer = document.getElementById('audioPlayer');
    const startBtn = document.getElementById('startBtn');
    const tapBtn = document.getElementById('tapBtn');
    const saveBtn = document.getElementById('saveBtn');
    const output = document.getElementById('output');
    let timestamps = [];
    let audioBaseName = "tune"; 

    // Rehearsal UI
    const playChunkBtn = document.getElementById('playChunkBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const playerOutput = document.getElementById('playerOutput');
    const musicVolume = document.getElementById('musicVolume');
    const metVolume = document.getElementById('metVolume');
    const playMetToggle = document.getElementById('playMetToggle');
    const countInSelect = document.getElementById('countInSelect');

    const loadMasterDataBtn = document.getElementById('loadMasterDataBtn');
    const dataStatus = document.getElementById('dataStatus');
    const tuneSelect = document.getElementById('tuneSelect');
    const startChunkSelect = document.getElementById('startChunk');
    const endChunkSelect = document.getElementById('endChunk');
    let masterChunks = [];

    // Audio Engine
    let loadedTimestamps = [];
    let stopTime = null; 
    let scheduledOscillators = []; 
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let musicBuffer = null;
    let musicSource = null;
    let musicGainNode = null;

    // --- STAGE 3: LIVE TRACKER VARIABLES ---
    let playbackAnimationId = null;
    let playbackActualStartTime = 0; 
    let playbackStartAudioTime = 0;
    let globalStartIdx = 0;
    let globalEndIdx = 0;

    musicVolume.addEventListener('input', (e) => {
      audioPlayer.volume = e.target.value; 
      if (musicGainNode) musicGainNode.gain.value = e.target.value; 
    });

    function stopAllAudio() {
      scheduledOscillators.forEach(osc => { try { osc.stop(); } catch(e) {} });
      scheduledOscillators = [];
      if (musicSource) { try { musicSource.stop(); } catch(e) {} musicSource = null; }
      cancelAnimationFrame(playbackAnimationId); // Stop the visual tracker
    }

    // ==========================================
    // IMAGE VIEW & MODE TOGGLE LOGIC
    // ==========================================
    function updateImageView() {
      if (!currentTuneId) return;
      displayImage.style.display = "block";
      
      let mPageFormatted = String(currentMusicPage).padStart(2, '0');
      let dPageFormatted = String(currentDrillPage).padStart(2, '0');
      
      if (activeVisualView === "music") {
        displayImage.src = `images/${currentTuneId}_music_${mPageFormatted}.jpg`;
      } else {
        displayImage.src = `images/${currentTuneId}_drill_${dPageFormatted}.jpg`;
      }
    }

    btnMusicView.addEventListener("click", () => {
      activeVisualView = "music";
      btnMusicView.classList.add("active");
      btnDrillView.classList.remove("active");
      updateImageView();
    });

    btnDrillView.addEventListener("click", () => {
      activeVisualView = "drill";
      btnDrillView.classList.add("active");
      btnMusicView.classList.remove("active");
      updateImageView();
    });

    // --- MODIFIED: Captures current beat before switching modes ---
    rehearsalMode.addEventListener("change", () => {
      let prevStartBeat = startChunkSelect.value ? parseInt(startChunkSelect.value) : null;
      let prevEndBeat = endChunkSelect.value ? parseInt(endChunkSelect.value) : null;

      if (rehearsalMode.value === "drill") {
        btnDrillView.click(); 
      } else {
        btnMusicView.click();
      }
      
      populateChunkDropdowns(currentTuneId, prevStartBeat, prevEndBeat);
    });

    // ==========================================
    // SWIPE GESTURES
    // ==========================================
    const viewerContainer = document.getElementById('viewer-container');
    let touchStartX = 0; let touchEndX = 0;

    viewerContainer.addEventListener('touchstart', e => {
      if(e.touches.length === 1) touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});

    viewerContainer.addEventListener('touchend', e => {
      if(e.changedTouches.length === 1) {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipeGesture();
      }
    }, {passive: true});

    function handleSwipeGesture() {
      const swipeThreshold = 50; 
      if (touchEndX < touchStartX - swipeThreshold) manualChangePage(1); // Swipe Left = Next
      if (touchEndX > touchStartX + swipeThreshold) manualChangePage(-1); // Swipe Right = Prev
    }

    function manualChangePage(directionModifier) {
      if (!currentTuneId) return;
      if (activeVisualView === "music") {
        let pageNum = parseInt(currentMusicPage) || 1;
        currentMusicPage = Math.max(1, pageNum + directionModifier).toString();
      } else {
        let pageNum = parseInt(currentDrillPage) || 1;
        currentDrillPage = Math.max(1, pageNum + directionModifier).toString();
      }
      updateImageView();
    }

    // ==========================================
    // DATA LOADING & DROPDOWNS
    // ==========================================
    loadMasterDataBtn.addEventListener('click', async () => {
      requestWakeLock(); 
      try {
        dataStatus.textContent = "Loading...";
        const response = await fetch('map.csv');
        if (!response.ok) throw new Error("File not found");
        
        const csvText = await response.text();
        parseCSV(csvText);
        populateTuneDropdown();
        
        dataStatus.textContent = `Loaded ${masterChunks.length} chunks.`;
        playerOutput.innerHTML = "CSV Loaded. Select a tune.";
      } catch (error) {
        dataStatus.textContent = "Error loading map.csv.";
      }
    });

    function parseCSV(text) {
      masterChunks = [];
      const lines = text.split('\n');
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const row = lines[i].split(',');
        const chunk = {
          tune: row[0] ? row[0].trim() : "",
          set: row[1] ? row[1].trim() : "",
          measure: row[2] ? row[2].trim() : "",
          startBeat: parseInt(row[3].trim()),
          counts: parseInt(row[4].trim()),
          drillPage: row[5] ? row[5].trim() : "",
          musicPage: row[6] ? row[6].trim() : "",
          label: row[7] ? row[7].replace(/[\r\n]+/g, '').trim() : ""
        };
        if (chunk.tune && !isNaN(chunk.startBeat)) masterChunks.push(chunk);
      }
    }

    function populateTuneDropdown() {
      tuneSelect.innerHTML = '<option value="">-- Select a Tune --</option>';
      const uniqueTunes = [...new Set(masterChunks.map(c => c.tune))];
      uniqueTunes.forEach(tune => {
        tuneSelect.insertAdjacentHTML('beforeend', `<option value="${tune}">${tune}</option>`);
      });
    }

    tuneSelect.addEventListener('change', async (e) => {
      currentTuneId = e.target.value;
      populateChunkDropdowns(currentTuneId);
      if (currentTuneId) {
        await loadTuneAssets(currentTuneId);
      } else {
        displayImage.style.display = "none";
      }
    });

    async function loadTuneAssets(tuneName) {
      stopAllAudio();
      musicBuffer = null;
      loadedTimestamps = [];
      playerOutput.innerHTML = `Fetching audio...`;
      try {
        const jsonResponse = await fetch(`${tuneName}_beats.json`);
        loadedTimestamps = await jsonResponse.json();
        const audioResponse = await fetch(`${tuneName}.mp3`);
        const arrayBuffer = await audioResponse.arrayBuffer();
        musicBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        playerOutput.innerHTML = `Ready! Loaded for ${tuneName}.`;
      } catch (error) {
        playerOutput.innerHTML = `<span style="color:#f44336;">Error loading assets</span>`;
      }
    }

    // --- MODIFIED: Accepts target beats to sync state ---
    function populateChunkDropdowns(selectedTune, targetStartBeat = null, targetEndBeat = null) {
      startChunkSelect.innerHTML = '';
      endChunkSelect.innerHTML = '';

      if (!selectedTune) {
        startChunkSelect.innerHTML = '<option value="">-- Select Tune --</option>';
        endChunkSelect.innerHTML = '<option value="">-- Select Tune --</option>';
        return;
      }

      const mode = rehearsalMode.value;
      
      const filteredChunks = masterChunks.filter(c => {
        if (c.tune !== selectedTune) return false;
        if (mode === "drill") return c.set !== "" || c.drillPage !== "";
        return c.measure !== "" || c.musicPage !== "";
      });

      filteredChunks.forEach((chunk, index) => {
        let displayName = "";
        if (chunk.label) displayName += `[${chunk.label}] `;
        
        if (mode === "drill" && chunk.set) displayName += `Set ${chunk.set}`;
        else if (mode === "measures" && chunk.measure) displayName += `Meas ${chunk.measure}`;
        else displayName += `Beat ${chunk.startBeat}`;

        const optionString = `<option value="${chunk.startBeat}" data-counts="${chunk.counts}" data-index="${index}">${displayName} (${chunk.counts} cts)</option>`;
        startChunkSelect.insertAdjacentHTML('beforeend', optionString);
        endChunkSelect.insertAdjacentHTML('beforeend', optionString);
      });
      
      if(filteredChunks.length > 0) {
          // Attempt state sync if values were passed
          if (targetStartBeat !== null) setClosestOption(startChunkSelect, targetStartBeat);
          if (targetEndBeat !== null) setClosestOption(endChunkSelect, targetEndBeat);
          
          startChunkSelect.dispatchEvent(new Event('change'));
      }
    }

    // --- NEW: Helper to find the closest matching beat ---
    function setClosestOption(selectElement, targetBeat) {
      let bestIndex = 0;
      let closestDiff = Infinity;
      for (let i = 0; i < selectElement.options.length; i++) {
          let optionBeat = parseInt(selectElement.options[i].value);
          let diff = Math.abs(optionBeat - targetBeat);
          if (diff < closestDiff) {
              closestDiff = diff;
              bestIndex = i;
          }
      }
      selectElement.selectedIndex = bestIndex;
    }

    function calculateCurrentPages() {
      if (startChunkSelect.selectedIndex === -1 || endChunkSelect.selectedIndex === -1) return;

      const startBeat = parseInt(startChunkSelect.value);
      const endBeat = parseInt(endChunkSelect.value);

      const masterStartIdx = masterChunks.findIndex(c => c.startBeat === startBeat && c.tune === currentTuneId);
      const masterEndIdx = masterChunks.findIndex(c => c.startBeat === endBeat && c.tune === currentTuneId);

      if (masterStartIdx !== -1) {
        for (let i = masterStartIdx; i >= 0; i--) {
          if (masterChunks[i].musicPage !== "" && masterChunks[i].musicPage != null) {
            currentMusicPage = masterChunks[i].musicPage;
            break;
          }
        }
      }

      if (masterEndIdx !== -1) {
        for (let i = masterEndIdx; i >= 0; i--) {
          if (masterChunks[i].drillPage !== "" && masterChunks[i].drillPage != null) {
            currentDrillPage = masterChunks[i].drillPage;
            break;
          }
        }
      }
      updateImageView(); 
    }

    startChunkSelect.addEventListener('change', () => {
      if (startChunkSelect.selectedIndex === -1) return;
      const currentIndex = startChunkSelect.selectedIndex;
      
      if (rehearsalMode.value === "drill") {
        if (currentIndex + 1 < endChunkSelect.options.length) {
          endChunkSelect.selectedIndex = currentIndex + 1;
        } else {
          endChunkSelect.selectedIndex = currentIndex; 
        }
      } else {
         endChunkSelect.selectedIndex = currentIndex; 
      }
      calculateCurrentPages();
    });

    endChunkSelect.addEventListener('change', calculateCurrentPages);

    // ==========================================
    // AUDIO PLAYER & LIVE TRACKER
    // ==========================================
    function scheduleBeep(time, isHighPitch) {
      let osc = audioCtx.createOscillator();
      let gainNode = audioCtx.createGain();
      
      osc.connect(gainNode); gainNode.connect(audioCtx.destination);
      osc.type = 'square'; osc.frequency.value = isHighPitch ? 3951.07 : 2637.02; 
      
      let currentMetVol = parseFloat(metVolume.value);
      gainNode.gain.setValueAtTime(currentMetVol, time);
      gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
      
      osc.start(time); osc.stop(time + 0.1);
      scheduledOscillators.push(osc);
    }

    // --- NEW: Live UI Update Loop ---
    function updatePlaybackUI() {
      if (!musicSource || audioCtx.state !== 'running') return;
      
      let now = audioCtx.currentTime;
      let timeSinceDownbeat = now - playbackActualStartTime;
      
      if (timeSinceDownbeat >= 0) {
        let elapsedAudioTime = timeSinceDownbeat + playbackStartAudioTime; 
        
        let currentBeatIdx = globalStartIdx;
        for (let i = globalStartIdx; i <= globalEndIdx; i++) {
            if (parseFloat(loadedTimestamps[i]) <= elapsedAudioTime) {
                currentBeatIdx = i;
            } else { break; }
        }
        
        let relativeCount = currentBeatIdx - globalStartIdx + 1;
        let actualBeatNum = currentBeatIdx + 1;
        
        let activeChunk = masterChunks.slice().reverse().find(c => c.tune === currentTuneId && c.startBeat <= actualBeatNum);
        let locationText = "--";
        
        if (activeChunk) {
            locationText = rehearsalMode.value === "drill" && activeChunk.set 
              ? `Set ${activeChunk.set}` 
              : `Meas ${activeChunk.measure || "--"}`;
        }
        
        playerOutput.innerHTML = `${locationText} &nbsp;|&nbsp; Count: <span style="color:white;">${relativeCount}</span>`;
      } else {
        playerOutput.innerHTML = `Count-in...`;
      }
      
      playbackAnimationId = requestAnimationFrame(updatePlaybackUI);
    }

    playChunkBtn.addEventListener('click', () => {
      requestWakeLock(); 
      if(!startChunkSelect.value || !endChunkSelect.value) return alert("Select a start and end chunk.");
      if(loadedTimestamps.length === 0 || !musicBuffer) return alert("Assets missing!");
      
      if (audioCtx.state === 'suspended') audioCtx.resume();
      stopAllAudio(); 
      
      const startIdx = parseInt(startChunkSelect.value) - 1;
      const endOption = endChunkSelect.options[endChunkSelect.selectedIndex];
      const endChunkCounts = parseInt(endOption.getAttribute('data-counts'));
      const endIdx = (parseInt(endChunkSelect.value) - 1) + endChunkCounts;
      
      if(startIdx < 0 || endIdx >= loadedTimestamps.length || startIdx >= endIdx) {
        return alert("Invalid beat range.");
      }

      const startTime = parseFloat(loadedTimestamps[startIdx]);
      stopTime = parseFloat(loadedTimestamps[endIdx]);

      let totalTimeDiff = 0;
      let beatsToAverage = Math.min(4, loadedTimestamps.length - startIdx - 1);
      for(let i = 0; i < beatsToAverage; i++) {
        totalTimeDiff += (parseFloat(loadedTimestamps[startIdx + i + 1]) - parseFloat(loadedTimestamps[startIdx + i]));
      }
      let beatDuration = totalTimeDiff / beatsToAverage || 0.5; 
      
      let now = audioCtx.currentTime;
      let countInBeats = parseInt(countInSelect.value);
      
      for (let i = 0; i < countInBeats; i++) {
        let clickTime = now + (i * beatDuration);
        let isHigh = (i === 0 || (countInBeats === 8 && i === 4));
        scheduleBeep(clickTime, isHigh);
      }

      if (playMetToggle.checked) {
        for (let i = startIdx; i <= endIdx; i++) {
          let timeOffsetFromStart = parseFloat(loadedTimestamps[i]) - startTime;
          let clickTime = now + (countInBeats * beatDuration) + timeOffsetFromStart;
          let relativeBeat = i - startIdx;
          let isHigh = (relativeBeat % 2 === 0);
          scheduleBeep(clickTime, isHigh);
        }
      }

      let downbeatTime = now + (countInBeats * beatDuration);
      let chunkDuration = stopTime - startTime;

      musicSource = audioCtx.createBufferSource();
      musicSource.buffer = musicBuffer;
      musicGainNode = audioCtx.createGain();
      musicGainNode.gain.value = parseFloat(musicVolume.value);
      
      musicSource.connect(musicGainNode);
      musicGainNode.connect(audioCtx.destination);
      musicSource.start(downbeatTime, startTime, chunkDuration);

      // --- Pass variables to Live Tracker and start loop ---
      playbackActualStartTime = downbeatTime; 
      playbackStartAudioTime = startTime;
      globalStartIdx = startIdx;
      globalEndIdx = endIdx;
      
      cancelAnimationFrame(playbackAnimationId);
      playbackAnimationId = requestAnimationFrame(updatePlaybackUI);
    });

    pauseBtn.addEventListener('click', () => {
      stopAllAudio();
      audioPlayer.pause(); 
      playerOutput.innerHTML = "Paused.";
    });

    stopBtn.addEventListener('click', () => {
      stopAllAudio();
      audioPlayer.pause();
      playerOutput.innerHTML = "Reset for next rep.";
    });

    // ==========================================
    // MAPPER LOGIC
    // ==========================================
    audioUpload.addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      audioBaseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
      audioPlayer.src = URL.createObjectURL(file);
    });

    startBtn.addEventListener('click', () => {
      timestamps = []; 
      output.innerHTML = "Recording taps...<br>";
      audioPlayer.play();
    });

    function recordTap() {
      if(audioPlayer.paused) return; 
      const currentTime = audioPlayer.currentTime.toFixed(3); 
      timestamps.push(currentTime);
      output.innerHTML += `Beat ${timestamps.length}: ${currentTime}s<br>`;
      output.scrollTop = output.scrollHeight; 
    }

    tapBtn.addEventListener('click', recordTap);
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
        e.preventDefault();
        recordTap();
      }
    });

    saveBtn.addEventListener('click', () => {
      if (timestamps.length === 0) return alert("No taps to save yet!");
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(timestamps));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href", dataStr);
      downloadAnchorNode.setAttribute("download", `${audioBaseName}_beats.json`);
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
    });
  </script>
</body>
</html>
